<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CekBMiku - Login</title>
  <link rel="stylesheet" href="css/login.css">

  <!-- Font Awesome untuk ikon mata -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="container">
    <div class="left-section">
      <div class="logo">
        <img src="asset/Logo.png" alt="Logo CekBMiku">
      </div>

      <div class="login-box">
        <h3>Lanjutkan perjalanan sehatmu, masuk disini!</h3>

        <form id="loginForm">
          <input type="text" id="name" placeholder="Nama" required />
          <input type="email" id="email" placeholder="Email" required />

          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Password" required />
            <i class="fa-solid fa-eye" id="togglePassword"></i>
          </div>

          <a href="#" class="forgot">Lupa Password?</a>
          <button type="submit" class="btn-login">Masuk</button>
        </form>

        <p class="register-text">Belum Punya Akun?</p>
        <button class="btn-register" onclick="window.location.href='register.html'">Register</button>
      </div>
    </div>

    <div class="right-section">
      <img src="asset/Login.png" alt="Illustrasi" />
    </div>
  </div>

  <!-- Hubungkan file JavaScript eksternal -->
  <script src="js/login.js"></script>
</body>
</html>
